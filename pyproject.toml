[tool.ruff]
line-length = 80

[tool.ruff.lint]
ignore = ["E501", "C901", "I001", "N802", "N801", "B023"]
select = [
    "C",
    "E",
    "F",
    "I",
    "W",
    "B",
    "Q",
    "UP",
    "ASYNC",
    "N",
    "ANN201",
    "ANN401",
    "ANN205",
    "ANN001",
    "ANN204",
    "ANN202",
]

[tool.ruff.lint.isort]
lines-after-imports = 2
known-first-party = ["diffusers"]
