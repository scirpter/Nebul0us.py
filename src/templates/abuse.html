{% extends "base.html" %} {% block content %}
<main class="max-w-4xl mx-auto px-6 py-10 space-y-8">
  <section class="card p-6 space-y-4">
    <div>
      <p class="text-xs uppercase tracking-[0.25em] text-slate-500">
        Danger Zone
      </p>
      <h1 class="text-2xl font-bold accent-text">Abuse Tools</h1>
    </div>
    <form class="space-y-3" action="/abuse/delete-account" method="post">
      <label class="text-sm text-slate-300">Sign-in Token</label>
      <input
        name="token"
        placeholder="Token"
        class="w-full px-3 py-2 rounded-lg bg-slate-900/60 border border-slate-700 text-sm"
        required
      />
      <button class="btn" type="submit">Delete Account</button>
    </form>
    <div class="h-px bg-slate-700/60"></div>
    <form class="space-y-3" action="/abuse/send-plasma" method="post">
      <label class="text-sm text-slate-300">Send Plasma</label>
      <input
        name="target"
        placeholder="Target Account ID"
        class="w-full px-3 py-2 rounded-lg bg-slate-900/60 border border-slate-700 text-sm"
        required
      />
      <input
        name="amount"
        placeholder="Amount"
        class="w-full px-3 py-2 rounded-lg bg-slate-900/60 border border-slate-700 text-sm"
        required
      />
      <input
        name="token"
        placeholder="Sign-in Token"
        class="w-full px-3 py-2 rounded-lg bg-slate-900/60 border border-slate-700 text-sm"
        required
      />
      <button class="btn" type="submit">Send Plasma</button>
    </form>
  </section>
</main>
{% endblock %}
